name: Build a publikace

# Po každém commitu na main se sestaví, otestuje a vydá předběžná verze na NuGet.
# Stabilní verze vzniká z tagu: `git tag v1.2.3 && git push origin v1.2.3`.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SQL_HESLO: ${{ secrets.TEST_SQL_PASSWORD || 'DbsViewer_CI_2026' }}

jobs:
  test:
    name: Kompilace a testy
    runs-on: ubuntu-latest

    # Integrační testy potřebují skutečný SQL Server. Bez něj klesne pokrytí
    # DbsViewer.SqlServer pod práh a build právem selže — viz ADR-0008.
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: ${{ secrets.TEST_SQL_PASSWORD || 'DbsViewer_CI_2026' }}
          MSSQL_PID: Developer
        ports:
          - 1433:1433

    steps:
      - uses: actions/checkout@v5
        with:
          # MinVer odvozuje verzi z git tagů, takže potřebuje celou historii.
          fetch-depth: 0

      - name: Instalace .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Čekání na SQL Server
        run: |
          # Otevřený port ještě neznamená, že server přijímá dotazy — čeká se
          # na skutečnou odpověď na SELECT.
          for pokus in $(seq 1 90); do
            if docker exec "$(docker ps --filter ancestor=mcr.microsoft.com/mssql/server:2022-latest --format '{{.ID}}' | head -1)" \
                 /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SQL_HESLO" -C -Q "SELECT 1" >/dev/null 2>&1; then
              echo "SQL Server odpovídá po ${pokus} s."
              exit 0
            fi
            sleep 1
          done

          echo "::error::SQL Server nenaběhl do 90 s. Bez něj neprojde práh pokrytí."
          docker ps -a
          docker logs "$(docker ps -aq --filter ancestor=mcr.microsoft.com/mssql/server:2022-latest | head -1)" | tail -40
          exit 1

      - name: Obnovení balíčků
        run: dotnet restore

      - name: Kompilace
        run: dotnet build --configuration Release --no-restore

      - name: Testy včetně vynuceného pokrytí
        env:
          DBSVIEWER_TEST_SQLSERVER: Server=localhost,1433;Database=master;User Id=sa;Password=${{ secrets.TEST_SQL_PASSWORD || 'DbsViewer_CI_2026' }};TrustServerCertificate=True;Connect Timeout=30
        run: |
          selhalo=0

          for projekt in EfCore Relational Server Ui Tool; do
            echo "::group::DbsViewer.$projekt.Tests"

            if ! dotnet test "tests/DbsViewer.$projekt.Tests/DbsViewer.$projekt.Tests.csproj" \
                 --configuration Release --no-build \
                 --logger "trx;LogFileName=$projekt.trx"; then
              selhalo=1
              echo "::error::Testy DbsViewer.$projekt.Tests selhaly."
            fi

            echo "::endgroup::"
          done

          exit $selhalo

      - name: Výsledky testů
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: vysledky-testu
          path: |
            **/TestResults/*.trx
            artifacts/coverage/**
          retention-days: 14
          if-no-files-found: ignore

  publikace:
    name: Vydání na NuGet
    needs: test
    runs-on: ubuntu-latest

    # Na pull requestech se nepublikuje — jinak by každý návrh zabral číslo verze.
    if: github.event_name != 'pull_request'

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Instalace .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Sestavení balíčků
        # Blazor UI se do serverového balíčku vkládá jen v Release.
        run: |
          dotnet pack --configuration Release --output artifacts/packages
          ls -lh artifacts/packages

      - name: Zjištění verze
        id: verze
        run: |
          soubor=$(ls artifacts/packages/DbsViewer.Server.*.nupkg | head -1)
          verze=$(basename "$soubor" .nupkg | sed 's/^DbsViewer\.Server\.//')
          echo "verze=$verze" >> "$GITHUB_OUTPUT"
          echo "Vydávaná verze: $verze"

      - name: Balíčky jako artefakt
        uses: actions/upload-artifact@v5
        with:
          name: balicky-${{ steps.verze.outputs.verze }}
          path: artifacts/packages/*.nupkg
          retention-days: 30

      - name: Publikace na NuGet
        # Bez klíče se krok přeskočí, aby fork nebo čerstvě naklonovaný
        # repozitář neselhal na chybějícím tajemství.
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::warning::Tajemství NUGET_API_KEY není nastavené, publikace se přeskočila. Balíčky jsou v artefaktech běhu."
            exit 0
          fi

          dotnet nuget push "artifacts/packages/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate

      - name: Vydání na GitHubu
        # Jen u tagů — z každého commitu na main by vznikala záplava vydání.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/packages/*.nupkg
          generate_release_notes: true
          name: DbsViewer ${{ steps.verze.outputs.verze }}
